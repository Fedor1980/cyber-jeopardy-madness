apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-api
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.scrollApi.autoscaling.enabled }}
  replicas: {{ .Values.scrollApi.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sovereign-scroll.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sovereign-scroll.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "sovereign-scroll.serviceAccountName" . }}
      containers:
      - name: api
        image: "{{ .Values.scrollApi.image.repository }}:{{ .Values.scrollApi.image.tag }}"
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: QDRANT_HOST
          value: {{ include "sovereign-scroll.fullname" . }}-qdrant
        - name: QDRANT_PORT
          value: "6333"
        - name: EMBEDDING_SERVICE_URL
          value: "http://{{ include "sovereign-scroll.fullname" . }}-embedding:8001"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sovereign-scroll.fullname" . }}-api-secret
              key: api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "sovereign-scroll.fullname" . }}-api-secret
              key: openai-api-key
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.scrollApi.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-api
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.scrollApi.service.type }}
  ports:
  - port: {{ .Values.scrollApi.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "sovereign-scroll.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

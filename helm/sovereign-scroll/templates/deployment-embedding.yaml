apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-embedding
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding
spec:
  {{- if not .Values.embeddingService.autoscaling.enabled }}
  replicas: {{ .Values.embeddingService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sovereign-scroll.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: embedding
  template:
    metadata:
      labels:
        {{- include "sovereign-scroll.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: embedding
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "sovereign-scroll.serviceAccountName" . }}
      containers:
      - name: embedding
        image: "{{ .Values.embeddingService.image.repository }}:{{ .Values.embeddingService.image.tag }}"
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          {{- toYaml .Values.embeddingService.resources | nindent 10 }}
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/torch
      volumes:
      - name: model-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-embedding
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding
spec:
  type: {{ .Values.embeddingService.service.type }}
  ports:
  - port: {{ .Values.embeddingService.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "sovereign-scroll.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embedding

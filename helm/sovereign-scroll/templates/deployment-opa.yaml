{{- if .Values.opa.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-opa
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      {{- include "sovereign-scroll.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opa
  template:
    metadata:
      labels:
        {{- include "sovereign-scroll.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opa
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-opa.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sovereign-scroll.serviceAccountName" . }}
      containers:
      - name: opa
        image: "{{ .Values.opa.image.repository }}:{{ .Values.opa.image.tag }}"
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        ports:
        - name: http
          containerPort: 8181
          protocol: TCP
        args:
        - "run"
        - "--server"
        - "--addr=0.0.0.0:8181"
        - "/policies"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.opa.resources | nindent 10 }}
        volumeMounts:
        - name: policies
          mountPath: /policies
          readOnly: true
      volumes:
      - name: policies
        configMap:
          name: {{ include "sovereign-scroll.fullname" . }}-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-opa
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  type: {{ .Values.opa.service.type }}
  ports:
  - port: {{ .Values.opa.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "sovereign-scroll.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opa
{{- end }}

{{- if .Values.security.networkPolicy.enabled }}
# Allow API to communicate with all backend services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-api
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sovereign-scroll.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "sovereign-scroll.name" . }}
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow communication with Qdrant
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: qdrant
    ports:
    - protocol: TCP
      port: 6333
  # Allow communication with Embedding Service
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: embedding
    ports:
    - protocol: TCP
      port: 8001
  # Allow external HTTPS for OpenAI API
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
---
# Processor network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-processor
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sovereign-scroll.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: processor
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow Kafka
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow Qdrant
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: qdrant
    ports:
    - protocol: TCP
      port: 6333
  # Allow OPA
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: opa
    ports:
    - protocol: TCP
      port: 8181
  # Allow Embedding Service
  - to:
    - podSelector:
        matchLabels:
          {{- include "sovereign-scroll.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: embedding
    ports:
    - protocol: TCP
      port: 8001
---

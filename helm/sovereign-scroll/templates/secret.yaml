apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}-api-secret
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.scrollApi.apiKey | quote }}
  {{- if .Values.scrollApi.openaiApiKey }}
  openai-api-key: {{ .Values.scrollApi.openaiApiKey | quote }}
  {{- end }}

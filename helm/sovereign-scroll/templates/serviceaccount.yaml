{{- if .Values.security.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sovereign-scroll.serviceAccountName" . }}
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sovereign-scroll.fullname" . }}
  labels:
    {{- include "sovereign-scroll.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sovereign-scroll.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "sovereign-scroll.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}

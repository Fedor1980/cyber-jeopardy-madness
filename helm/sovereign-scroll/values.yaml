# Default values for sovereign-scroll
# This is a YAML-formatted file.

global:
  namespace: sovereign-scroll
  pullPolicy: IfNotPresent

# Kafka configuration
kafka:
  enabled: true
  replicas: 1
  image:
    repository: confluentinc/cp-kafka
    tag: "7.5.0"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 9092

# OPA (Open Policy Agent) configuration
opa:
  enabled: true
  replicas: 1
  image:
    repository: openpolicyagent/opa
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8181
  policies:
    configMap: opa-policies
    templates:
      gdpr: true
      hipaa: false
      ccpa: false

# Qdrant vector database configuration
qdrant:
  enabled: true
  replicas: 1
  image:
    repository: qdrant/qdrant
    tag: "latest"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334

# Embedding Service configuration
embeddingService:
  enabled: true
  replicas: 2
  image:
    repository: sovereign-scroll/embedding-service
    tag: "2.0.0"
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  service:
    type: ClusterIP
    port: 8001
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Scroll Processor configuration
scrollProcessor:
  enabled: true
  replicas: 3
  image:
    repository: sovereign-scroll/scroll-processor
    tag: "2.0.0"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  kafka:
    topic: scrolls.raw
    groupId: scroll-processor-group
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

# Scroll API configuration
scrollApi:
  enabled: true
  replicas: 3
  image:
    repository: sovereign-scroll/scroll-api
    tag: "2.0.0"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    type: LoadBalancer
    port: 8000
    annotations: {}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
  apiKey: "CHANGE_ME_IN_PRODUCTION"
  openaiApiKey: ""

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.sovereignscroll.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: scroll-api-tls
      hosts:
        - api.sovereignscroll.io

# Monitoring configuration
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Service Account
serviceAccount:
  create: true
  name: ""

# Security configuration
security:
  networkPolicy:
    enabled: true
  podSecurityPolicy:
    enabled: true
  rbac:
    create: true

# Resource quotas
resourceQuota:
  enabled: false
  requests:
    cpu: "10"
    memory: "20Gi"
  limits:
    cpu: "20"
    memory: "40Gi"

# Development environment overrides
global:
  pullPolicy: Always

# Disable autoscaling in development
scrollApi:
  replicas: 1
  autoscaling:
    enabled: false
  service:
    type: ClusterIP

embeddingService:
  replicas: 1
  autoscaling:
    enabled: false

scrollProcessor:
  replicas: 1
  autoscaling:
    enabled: false

# Disable persistence in development (use emptyDir)
qdrant:
  persistence:
    enabled: false

kafka:
  persistence:
    enabled: false

# Disable ingress in development (use port-forward)
ingress:
  enabled: false

# Disable monitoring in development
monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Relaxed resource limits for development
scrollApi:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

embeddingService:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

scrollProcessor:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

qdrant:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

kafka:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

opa:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

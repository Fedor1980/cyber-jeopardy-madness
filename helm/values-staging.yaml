# Staging environment overrides
global:
  pullPolicy: IfNotPresent

# Moderate autoscaling for staging
scrollApi:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  service:
    type: LoadBalancer

embeddingService:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

scrollProcessor:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# Enable persistence with smaller volumes
qdrant:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard"

kafka:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"

# Enable ingress with staging domain
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/rate-limit: "50"
  hosts:
    - host: staging-api.sovereignscroll.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: scroll-api-staging-tls
      hosts:
        - staging-api.sovereignscroll.io

# Enable monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Standard resource allocation
scrollApi:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

embeddingService:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

scrollProcessor:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Enable network policies
security:
  networkPolicy:
    enabled: true
  rbac:
    create: true

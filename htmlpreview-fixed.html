<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub &amp; BitBucket HTML Preview</title>
	<style>
		/* Modern CSS Reset and Base Styles */
		* {
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			font-size: 16px;
			line-height: 1.6;
			color: #24292e;
			background-color: #f6f8fa;
			margin: 0;
			padding: 20px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		main {
			width: 100%;
			max-width: 800px;
			background: #ffffff;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
			padding: 40px;
		}

		h1 {
			font-size: 28px;
			font-weight: 600;
			color: #24292e;
			margin: 0 0 20px 0;
			text-align: center;
		}

		a {
			color: #0366d6;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		#previewform {
			/* Form is now visible by default - Issue #1 FIXED */
			display: block;
			text-align: center;
		}

		.form-group {
			margin: 20px 0;
		}

		label {
			/* Issue #5 FIXED - Added accessible label */
			display: block;
			font-weight: 600;
			margin-bottom: 8px;
			color: #24292e;
			text-align: left;
		}

		#file {
			width: 100%;
			padding: 12px;
			border: 1px solid #d1d5da;
			border-radius: 6px;
			font-size: 16px;
			font-family: inherit;
			transition: border-color 0.2s;
		}

		#file:focus {
			outline: none;
			border-color: #0366d6;
			box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.1);
		}

		.submit-btn {
			background-color: #2ea44f;
			color: #ffffff;
			border: none;
			padding: 12px 24px;
			border-radius: 6px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			margin-top: 16px;
			transition: background-color 0.2s;
		}

		.submit-btn:hover {
			background-color: #2c974b;
		}

		.submit-btn:active {
			background-color: #298e46;
		}

		.example {
			margin: 24px 0;
			padding: 16px;
			background-color: #f6f8fa;
			border-radius: 6px;
			text-align: left;
		}

		.example p {
			margin: 8px 0;
			font-size: 14px;
			color: #586069;
		}

		code {
			background-color: #f6f8fa;
			padding: 3px 6px;
			border-radius: 3px;
			font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
			font-size: 14px;
		}

		strong {
			color: #24292e;
			background-color: #fffbdd;
			padding: 2px 4px;
			border-radius: 3px;
			font-weight: 600;
		}

		footer {
			/* Issue #6 FIXED - Improved contrast and readability */
			margin: 24px 0 0 0;
			padding-top: 24px;
			border-top: 1px solid #e1e4e8;
			font-size: 14px;
			color: #586069;
			text-align: center;
		}

		.error-message {
			display: none;
			margin: 16px 0;
			padding: 12px;
			background-color: #ffeef0;
			border: 1px solid #f97583;
			border-radius: 6px;
			color: #d73a49;
			font-size: 14px;
		}

		.error-message.show {
			display: block;
		}

		@media (max-width: 600px) {
			body {
				padding: 10px;
			}

			main {
				padding: 20px;
			}

			h1 {
				font-size: 24px;
			}

			#file {
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<!-- Issue #8 FIXED - Added semantic HTML structure -->
	<main>
		<!-- Issue #3 FIXED - Removed inline onsubmit handler -->
		<form id="previewform">
			<h1>GitHub &amp; BitBucket HTML Preview</h1>

			<div class="form-group">
				<!-- Issue #5 FIXED - Added label for accessibility -->
				<label for="file">Enter URL of the HTML file to preview:</label>
				<input
					type="url"
					id="file"
					name="file"
					value=""
					placeholder="e.g. https://github.com/user/repo/blob/master/index.html"
					autofocus
					required
					aria-describedby="url-help"
				>
			</div>

			<!-- Issue #9 FIXED - Error message display -->
			<div id="error-message" class="error-message" role="alert"></div>

			<button type="submit" class="submit-btn">Preview</button>

			<div class="example" id="url-help">
				<p><strong>How to use:</strong></p>
				<p>You can prepend to the URL:</p>
				<p><code><strong>http://htmlpreview.github.io/?</strong>https://github.com/twbs/bootstrap/blob/gh-pages/2.3.2/index.html</code></p>
				<p>Or enter the GitHub/BitBucket URL directly above.</p>
			</div>

			<footer>
				Developed by <a href="https://github.com/niutech" target="_blank" rel="noopener noreferrer">niu tech</a> |
				Contribute on <a href="https://github.com/htmlpreview/htmlpreview.github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
			</footer>
		</form>
	</main>

	<!--
		Issue #2 FIXED - JavaScript inlined instead of external reference
		Issue #3 FIXED - Proper event listener instead of inline handler
		Issue #4 FIXED - Using document.getElementById()
		Issue #9 FIXED - Added URL validation
		Issue #10 FIXED - Added proper URL encoding and security checks
	-->
	<script>
		(function() {
			'use strict';

			const form = document.getElementById('previewform');
			const fileInput = document.getElementById('file');
			const errorMessage = document.getElementById('error-message');

			/**
			 * Validates if the provided string is a valid URL
			 * @param {string} urlString - The URL to validate
			 * @returns {boolean} - True if valid, false otherwise
			 */
			function isValidURL(urlString) {
				try {
					const url = new URL(urlString);
					// Only allow http and https protocols for security
					return url.protocol === 'http:' || url.protocol === 'https:';
				} catch (e) {
					return false;
				}
			}

			/**
			 * Shows an error message to the user
			 * @param {string} message - The error message to display
			 */
			function showError(message) {
				errorMessage.textContent = message;
				errorMessage.classList.add('show');
				errorMessage.setAttribute('aria-live', 'polite');
			}

			/**
			 * Hides the error message
			 */
			function hideError() {
				errorMessage.textContent = '';
				errorMessage.classList.remove('show');
			}

			/**
			 * Handles form submission with proper validation and encoding
			 * @param {Event} e - The submit event
			 */
			function handleSubmit(e) {
				e.preventDefault();
				hideError();

				// Get and trim the input value
				const inputValue = fileInput.value.trim();

				// Validate that input is not empty
				if (!inputValue) {
					showError('Please enter a URL.');
					fileInput.focus();
					return;
				}

				// Validate URL format and protocol
				if (!isValidURL(inputValue)) {
					showError('Please enter a valid HTTP or HTTPS URL.');
					fileInput.focus();
					return;
				}

				// Check if it's a GitHub or BitBucket URL (optional warning)
				const url = new URL(inputValue);
				const isGitHub = url.hostname.includes('github.com');
				const isBitBucket = url.hostname.includes('bitbucket.org');

				// Service is optimized for GitHub and BitBucket but supports other hosts

				// Properly encode the URL for the query parameter
				// Issue #10 FIXED - Using encodeURIComponent for security
				const encodedURL = encodeURIComponent(inputValue);
				const previewURL = '/?' + encodedURL;

				// Redirect to the preview page
				window.location.href = previewURL;
			}

			// Add event listener to form submission
			// Issue #3 FIXED - Using proper event listener instead of inline handler
			form.addEventListener('submit', handleSubmit);

			// Clear error on input
			fileInput.addEventListener('input', function() {
				if (errorMessage.classList.contains('show')) {
					hideError();
				}
			});

			// Issue #7 FIXED - Fallback is no longer needed since form is visible by default
			// Form initialization complete
		})();
	</script>
</body>
</html>
